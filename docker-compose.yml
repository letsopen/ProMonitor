services:
  promonitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: promonitor:latest
    container_name: promonitor
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      DB_PATH: "/app/data/promonitor.db"
      # 以下三个变量来自同目录的 .env（docker compose 自动读取）
      HMAC_SECRET: "${HMAC_SECRET}"
      ADMIN_PASS: "${ADMIN_PASS}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-session-secret}"
      # 探测方式：tcp / icmp（icmp 需在服务下加 cap_add: [NET_RAW]）
      PING_TYPE: "${PING_TYPE:-tcp}"
    volumes:
      - promonitor-data:/app/data

volumes:
  promonitor-data:

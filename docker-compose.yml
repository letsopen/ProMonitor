# 镜像由 GitHub Actions 构建并推送 GHCR（见 .github/workflows/docker-image.yml），
# 本地不再执行 docker build —— 直接 pull CI 产出的镜像。
# 用法：cp .env.example .env 填写密钥后执行 `docker compose up -d`（首次会自动 pull）。
services:
  promonitor:
    image: ghcr.io/letsopen/promonitor:latest
    container_name: promonitor
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      DB_PATH: "/app/data/promonitor.db"
      # 以下三个变量来自同目录的 .env（docker compose 自动读取）
      HMAC_SECRET: "${HMAC_SECRET}"
      ADMIN_PASS: "${ADMIN_PASS}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-session-secret}"
      # 探测方式：tcp / icmp（icmp 需在服务下加 cap_add: [NET_RAW]）
      PING_TYPE: "${PING_TYPE:-tcp}"
    volumes:
      - promonitor-data:/app/data

volumes:
  promonitor-data:
